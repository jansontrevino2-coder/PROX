<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Proxy + YouTube</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><section class="browser"><header><div class="dots"><i></i><i></i><i></i></div><h1>Safe Proxy</h1><nav><button class="tab active" data-mode="web" type="button">Web</button><button class="tab" data-mode="youtube" type="button">YouTube</button></nav></header>
<section id="webMode" class="mode active"><form id="bar"><input id="url" value="https://example.com" required autocomplete="off" spellcheck="false" aria-label="Destination URL"><button type="submit">Open</button></form><div id="status">Public HTTPS destinations only</div><iframe id="view" title="Proxied page" sandbox="allow-scripts allow-same-origin"></iframe></section>
<section id="youtubeMode" class="mode"><form id="ytBar"><input id="ytInput" placeholder="Search YouTube or paste a video link" required autocomplete="off" aria-label="YouTube search"><button type="submit">Search</button></form><div id="ytStatus">Search for videos or paste a YouTube link.</div><div id="ytContent"><div id="playerWrap" hidden><iframe id="ytPlayer" title="YouTube player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div id="results"></div></div></section>
</section><p class="note">Public HTTPS proxying blocks local/private networks and custom ports. YouTube playback uses the official embedded player. Search requires a server-side <code>YOUTUBE_API_KEY</code> environment variable.</p></main><script src="/app.js"></script></body></html>
